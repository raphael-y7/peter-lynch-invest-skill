      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 贵不贵"高频独立意图；公式可复算断言；A股适配节处理整体市场P/E基准差异
- capability_id: cap.one-up-on-wall-street.financial-checklist-13
  revision: 1
  status: active
  slug: financial-checklist-13
  title: 13项财务指标核查
  importance: critical
  importance_rationale: task-06，用户单元④：第13章全部小节+年报阅读法是基本面分析主干；每股净现金调价、负债结构生死判定（GCA vs 应用材料）等口径直接决定结论
