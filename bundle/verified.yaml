  - 现金流量
  - 存货
  - 养老金
  - 增长率
  - 税后利润
  - 年报
  - balance sheet
  - cash position
  - debt to equity
  also_read:
  - research-info-gathering
  - pe-valuation
  - analyze-checklist-ch15
  card: cards/financial-checklist-13.md
  frontmatter:
    description: '按第13章口径核查13项指标：产品销售占比/P/E/现金头寸（每股净现金=（现金+证券-长期负债)/股本，调低实际买价）/

      负债（权益75%负债25%正常线；短期银行负债最危险、长期债券最安全）/股息（20-30年连续提高记录）/账面价值（经常失真）/

      隐蔽资产/自由现金流（股价10%底线）/存货（增速超销售=危险）/养老金计划/增长率/税前利润率。

      trigger："帮我看看这家公司财报""年报怎么读""这家公司现金多不多/负债危险吗"。输入财报数据输出逐项核查表。

      A股适配节做科目映射与查询渠道。

      '
