      "只有3美元我能亏多少""最终会涨回来的""黎明前总是最黑暗""等反弹到10美元再卖""保守型股票不会波动大"

      "等太久了不可能涨了""看我损失了多少没买""错过这只要抓住下一只""涨了就是对跌了就是错"）并逐条给出书中反驳与案例数字。

