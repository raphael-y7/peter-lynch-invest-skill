  one_liner: 卖出看类型不看浮盈浮亏——缓慢增长涨30-50%兑现、周期在低P/E时警惕、快速增长盯同店与扩张失速
  intents:
  - 判断一只持仓股票现在该不该卖
  - 区分"基本面恶化必须卖"与"价格波动不用卖"
  - 识别煽动效应与过早卖出陷阱
  keywords:
