schema_version: 1
bundle_id: bundle.one-up-on-wall-street
book:
  title: 彼得·林奇的成功投资（One Up on Wall Street）
  author: 彼得·林奇、约翰·罗瑟查尔德（刘建位、徐晓杰 译，机械工业出版社2010）
  source_pack: 彼得·林奇的成功投资_合并转写稿.md（导论+三部分20章+33张图表转写）
  baseline_tag: distill-2026-10
entry:
  name: peter-lynch-invest-skill
  description: '基于《彼得·林奇的成功投资》的 A 股选股分析工具包：先给公司归类（缓慢增长/稳定增长/快速增长/周期/困境反转/隐蔽资产六类），

    按类型设定期望与卖出判据，用 P/E 与收益口径估值，用 13 项财务指标核查基本面，用双向清单筛选候选，

    识别 12 种危险心理说法。适用 trigger：分析个股基本面、估值贵不贵、该不该卖、持仓复查、组合搭配；

    不适用：预测大盘涨跌、期权期货卖空、短线择时。每张能力卡含独立「A股适配」小节（编译者补充，非原书内容）。

    '
  core_principles:
  - 投资的是公司，不是股市；不预测市场，唯一的买入信号是找到值得研究的公司
  - 先分类后行动：六类公司分类决定买入期望、核查重点与卖出判据
  - 股价长期跟随收益：P/E 与增长率比较、与历史比较、与整体市场比较，绝不买超高 P/E
  - 发现只是第一步：下单前必须完成研究并能两分钟讲清"故事"（为什么买、成功条件、风险）
  - 卖出按类型判据执行，价格下跌本身不是卖出理由；"拔掉鲜花浇灌野草"是最大错误
  - 避开热门股、故事股、多元恶化与一切期权期货卖空
  out_of_scope:
  - 大盘/指数走势预测与择时（书中明确否定）
  - 期权、期货、卖空策略（书中结论为明确不做，仅提供否定理由）
  - 债券与基金选择的完整方法（书中仅作收益对比论据）
  - 具体个股买卖推荐
  stop_conditions:
  - 公司类型无法判定时，先回到分类能力完成归型，不带着模糊类型继续分析
  - 关键财务数据（收益、负债、现金、增长率）缺失时先补数据，不猜值
  - 用户资金为两三年内必需用途或未通过入市三问时，停止选股分析（U12）
  - 候选命中避买清单硬性红旗（热门股/多元恶化/单一客户依赖等）时，直接排除不再进入估值
router_entry:
  name: peter-lynch-invest-skill-router
  description: '《彼得·林奇的成功投资》来源路由入口：当用户的股票分析任务未命中任一晋级 Skill 的触发条件，

    或需要书中未被晋级为独立入口的能力（两分钟独白、定期复查、组合纪律、入市自测、调研程序）时，

    经此入口到达全部 12 张能力卡。trigger：林奇/Lynch/彼得林奇选股法、业余投资者优势、

    "帮我用林奇的方法…"、持仓复查节奏、调研一家上市公司的方法等。

    '
promotion_budget: 8
capabilities:
- capability_id: cap.one-up-on-wall-street.classify-six-types
  revision: 1
  status: active
  slug: classify-six-types
  title: 六类公司分类判定
  importance: critical
  importance_rationale: 全书中枢（task-01/task-13）：第7章一切规则按类型分叉，17.4卖出判据、15.1核查清单、独白模板均以分类为前置；分类错误导致期望与卖出规则全错
  one_liner: 先归类再谈买卖——用增长率与收益形态把公司放入六类之一，类型决定一切后续规则
  intents:
  - 判断一家公司属于六类中的哪一类
  - 判断热门产品对公司的意义（产品净利润占比测算）
  - 评估一家大公司股票的上涨空间上限
  keywords:
  - 六类公司
  - 分类
  - 缓慢增长型
  - 稳定增长型
  - 快速增长型
  - 周期型
  - 困境反转
  - 隐蔽资产
  - tenbagger
  - 10倍股
  - 公司分类
  - classify company
  - stock type
  also_read:
  - analyze-checklist-ch15
  - sell-rules-by-type
  - two-minute-story
  card: cards/classify-six-types.md
  frontmatter:
    description: '判定一家上市公司属于六类（缓慢增长/稳定增长/快速增长/周期/困境反转/隐蔽资产）中的哪一类，

      并测算热门产品对净利润的影响占比。trigger："这是什么类型的股票/公司"、"这家公司算周期股还是成长股"、

      "XX产品这么火能买它股票吗"、"这公司涨了这么多了还能涨吗"。输出：类型判定+判定依据+类型对应的期望收益与后续核查入口。

      不做估值与买卖决策（交给相邻能力）；六类边界模糊区间按书中口径给出最近似类型并标注不确定。

      A股适配小节处理行业分类与增长率口径差异。

      '
    tags:
    - decision
    - framework
    - stock-classification
  source_evidence:
  - source_id: src-main-book
    location: 第7章 L993-1456（7.1产品占比/7.2规模/7.3六型定义/7.4类型迁移/7.5区别对待）；导论0.6；13.1
  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 用户会单独问"这是哪类公司"；输入(公司概况/增长率/收益形态)输出(类型+依据)自含；每次个股分析复用；正负例清晰
