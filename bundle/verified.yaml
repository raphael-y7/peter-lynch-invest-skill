- capability_id: cap.one-up-on-wall-street.pe-valuation
  revision: 1
  status: active
  slug: pe-valuation
  title: 市盈率与收益估值口径
  importance: critical
  importance_rationale: task-05/task-14，用户单元③：P/E是全书唯一系统估值口径；"绝不买超高P/E"是硬红线；收益线背离是作者图形论证核心
  one_liner: 股价跟着收益走——P/E与增长率比、与历史比、与市场比，(增长率+股息率)/P/E≥1.5才吸引人，绝不买超高P/E
  intents:
  - 判断一只股票当前价格贵不贵
  - 计算并解读市盈率（vs增长率/历史区间/行业/整体市场）
  - 用收益线与股价线背离判断风险
  - 判断买入时点（整体市场P/E水位+恐慌窗口）
  keywords:
  - 市盈率
  - P/E
  - 估值
  - 收益增长率
  - 收益线
  - 背离
  - 高估
  - 低估
  - 买入时机
  - valuation
  - price earnings ratio
  - overvalued
  also_read:
  - financial-checklist-13
  - stock-screening-checklists
  - analyze-checklist-ch15
  card: cards/pe-valuation.md
  frontmatter:
    description: '用林奇口径完成估值判断：P/E vs 收益增长率（相等合理、一半偏便宜、两倍危险）、(增长率+股息率)/P/E≥1.5、

      vs 自身历史区间、vs 整体市场水位（风向标）；收益线与股价线背离信号（价远高于线→等待回归）；

      两个买入窗口（系统性恐慌期/整体低P/E期）。trigger："贵不贵""现在估值什么水平""P/E 40倍能买吗""收益涨股价不涨说明什么"。

      不预测大盘；周期股P/E需按周期位置反转解读。

      '
    tags:
    - calculation
    - valuation
    - decision
  source_evidence:
