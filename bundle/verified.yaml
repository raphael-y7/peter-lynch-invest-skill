  card: cards/sell-rules-by-type.md
  frontmatter:
    description: '按公司类型套用第17章17.4卖出判据：缓慢增长（涨30-50%或股息停滞）、稳定增长（涨50%-100%或增速失守）、

      周期（存货/产能/低P/E预警）、快速增长（同店销售降3%、扩张失速、30倍P/E配15-20%增长）、困境反转（债务回升/重整停滞）、

      隐蔽资产（等资产价值兑现）。trigger："该不该卖""涨了这么多要不要落袋""跌了要不要割"。

      价格下跌本身不是卖出理由；与定期复查（recheck-holdings）联动区分核查与卖出。

